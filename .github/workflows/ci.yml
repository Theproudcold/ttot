name: CI

on:
  push:
    branches: [main]
  pull_request:

# 最小权限：CI 只需要读仓库内容，避免默认令牌带上写权限
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 第三方 action 锁定到 v4 对应的提交（tag 可被移动，指向非预期代码）
      # v4 -> b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck and build
        run: pnpm build

      # 未被引用的局部声明几乎总是重构后的残留（本地函数、失效导入）。
      # 本仓库历史上多轮「先评审再重实现」留下了成片无人调用的代码，
      # 这一步把它们挡在合入之前，而不是等下一次考古时才发现。
      # 注意只对 src 生效：测试里常有故意的未用桩。
      - name: Dead-code guard (noUnusedLocals)
        run: pnpm check:unused

      - name: Test
        run: pnpm test
